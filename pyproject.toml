[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-monitor"
version = "0.2.1"
description = "A read-only terminal dashboard for SLURM jobs, GPU allocations and job diagnostics"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dongwoo Kim", email = "dongwookim.ml@gmail.com"}]
requires-python = ">=3.8"
dependencies = ["rich>=13.0.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "build>=1.0"]

[project.scripts]
slurm-monitor = "slurm_monitor:main"

[project.urls]
Homepage = "https://github.com/dongwookim-ml/slurm-monitor"
Repository = "https://github.com/dongwookim-ml/slurm-monitor"
Issues = "https://github.com/dongwookim-ml/slurm-monitor/issues"

[tool.setuptools]
py-modules = ["slurm_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
